[package]
name = "bananium-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bananium-core = { path = "../bananium-core" }
bananium-net = { path = "../bananium-net" }
bananium-meta = { path = "../bananium-meta" }
bananium-store = { path = "../bananium-store" }
bananium-instance = { path = "../bananium-instance" }
bananium-launch = { path = "../bananium-launch" }
bananium-java = { path = "../bananium-java" }
bananium-modrinth = { path = "../bananium-modrinth" }
bananium-discord = { path = "../bananium-discord" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["sync", "rt", "process", "macros", "time"] }
tracing = "0.1"
strum = { version = "0.28", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[features]
# Derive TypeScript bindings for `Command`/`CommandOutput`/`Event` and their
# DTOs so the Tauri webview's types can't drift from the Rust ones.
# Regenerate with `cargo test -p bananium-api --features ts export_bindings`;
# output lands in `desktop/src/bindings/` (see `.cargo/config.toml`).
ts = ["dep:ts-rs", "bananium-core/ts", "bananium-instance/ts"]
