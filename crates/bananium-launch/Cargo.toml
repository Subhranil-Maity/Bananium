[package]
name = "bananium-launch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bananium-core = { path = "../bananium-core" }
bananium-meta = { path = "../bananium-meta" }
bananium-store = { path = "../bananium-store" }
thiserror = "2"
tracing = "0.1"
md-5 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
