[package]
name = "bananium-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Derive TypeScript bindings (ts-rs) for types the desktop webview sees.
# Enabled through `bananium-api`'s own `ts` feature; see that crate.
ts = ["dep:ts-rs"]
