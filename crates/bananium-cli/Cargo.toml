[package]
name = "bananium-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bananium"
path = "src/main.rs"

[dependencies]
bananium-api = { path = "../bananium-api" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde_json = "1"
