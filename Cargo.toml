[workspace]
resolver = "2"
members = [
    "crates/bananium-core",
    "crates/bananium-api",
    "crates/bananium-net",
    "crates/bananium-store",
    "crates/bananium-meta",
    "crates/bananium-java",
    "crates/bananium-modrinth",
    "crates/bananium-discord",
    "crates/bananium-instance",
    "crates/bananium-launch",
    "crates/bananium-tui",
    "crates/bananium-cli",
    "crates/bananium-rpc",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
